<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtWzC9e5dLSjmnFONVQ_d6JwSOb2OzhQA",
  authDomain: "agromanager-2d113.firebaseapp.com",
  projectId: "agromanager-2d113",
  storageBucket: "agromanager-2d113.firebasestorage.app",
  messagingSenderId: "968764019693",
  appId: "1:968764019693:web:4477bd3a553e035e1c4de4",
  measurementId: "G-K3RG4W61TD"
};

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);
const firestore = getFirestore(firebaseApp);
const provider = new GoogleAuthProvider();
let cloudReady = false;
let currentUser = null;
let pendingTimer = null;

function fire(name, detail={}) { window.dispatchEvent(new CustomEvent(name,{detail})); }
async function stateRef(user){ return doc(firestore,'users',user.uid,'app','state'); }

window.agroCloud = {
  async login(){
    try { await signInWithPopup(firebaseAuth, provider); }
    catch(err){
      if(['auth/popup-blocked','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment'].includes(err?.code)) {
        await signInWithRedirect(firebaseAuth, provider);
      } else { throw err; }
    }
  },
  async logout(){ await signOut(firebaseAuth); },
  getUser(){ return currentUser; },
  isReady(){ return cloudReady; },
  scheduleSave(data){
    if(!currentUser || !cloudReady) return;
    clearTimeout(pendingTimer);
    pendingTimer=setTimeout(async()=>{
      try{
        await setDoc(await stateRef(currentUser), {data: JSON.parse(JSON.stringify(data)), updatedAt: serverTimestamp()}, {merge:true});
        fire('agro-cloud-status',{status:'saved',user:currentUser});
      }catch(error){ fire('agro-cloud-status',{status:'error',user:currentUser,error}); }
    },450);
  },
  async saveNow(data){
    if(!currentUser) throw new Error('Najpierw zaloguj się do Google.');
    await setDoc(await stateRef(currentUser), {data: JSON.parse(JSON.stringify(data)), updatedAt: serverTimestamp()}, {merge:true});
    fire('agro-cloud-status',{status:'saved',user:currentUser});
  }
};

try { await setPersistence(firebaseAuth,browserLocalPersistence); } catch(e) { console.warn('Firebase persistence:',e); }

onAuthStateChanged(firebaseAuth, async user => {
  currentUser=user||null; cloudReady=false;
  if(!user){ fire('agro-cloud-auth',{user:null,status:'offline'}); return; }
  fire('agro-cloud-auth',{user,status:'loading'});
  try{
    const snap=await getDoc(await stateRef(user));
    if(snap.exists() && snap.data()?.data){
      fire('agro-cloud-data',{data:snap.data().data,user});
    }else if(typeof window.getAgroData==='function'){
      await setDoc(await stateRef(user), {data: JSON.parse(JSON.stringify(window.getAgroData())), updatedAt: serverTimestamp()}, {merge:true});
      fire('agro-cloud-status',{status:'migrated',user});
    }
    cloudReady=true;
    fire('agro-cloud-auth',{user,status:'ready'});
  }catch(error){
    console.error('Firestore load:',error);
    fire('agro-cloud-status',{status:'error',user,error});
  }
});
</script>

function normalizeFarm(f){f=f||{};if(!f.parcels&&f.fields){f.parcels=f.fields;delete f.fields}if(!f.farmFields){f.farmFields=(f.crops||[]).map(c=>({id:c.designation,name:'Pole '+c.designation,area:c.area,crop:c.crop,variety:'',parcels:c.parcels||[],payments:c.payments||'',ecoschemes:c.ecoschemes||'',history:[{season:2026,crop:c.crop,variety:'',area:c.area,yield:'',notes:'Import ARiMR 2026'}]}))}f.parcels=f.parcels||[];f.operations=f.operations||[];f.machines=f.machines||[];f.finances=f.finances||[];f.rain=f.rain||[];f.notes=f.notes||[];f.settings=f.settings||{};return f}
function normalizeRoot(raw){if(raw&&raw.farms&&raw.activeFarmId){for(const k of Object.keys(raw.farms))raw.farms[k]=normalizeFarm(raw.farms[k]);if(!raw.farms[raw.activeFarmId])raw.activeFarmId=Object.keys(raw.farms)[0];raw.version=12;return raw}const f=normalizeFarm(raw||JSON.parse(JSON.stringify(SEED)));const id='farm_main';f.settings.farmName=f.settings.farmName||f.settings.userName||DEFAULT_USER;return {version:12,activeFarmId:id,farms:{[id]:f}}}
let root=normalizeRoot(JSON.parse(localStorage.getItem(KEY)||'null')||SEED);let db=root.farms[root.activeFarmId];
let page='dashboard', selectedField=null, mapObj=null;
function save(){root.farms[root.activeFarmId]=db;localStorage.setItem(KEY,JSON.stringify(root));if(window.agroCloud)window.agroCloud.scheduleSave(root)}window.getAgroData=()=>root;
function farmName(f=db){return f?.settings?.farmName||f?.settings?.userName||'Gospodarstwo'}
function switchFarm(id){if(!root.farms[id])return;root.farms[root.activeFarmId]=db;root.activeFarmId=id;db=root.farms[id];selectedField=null;ensureSettings();save();render();toast('Przełączono na: '+farmName())}
function addFarm(){modal('Dodaj gospodarstwo',`<form onsubmit="saveNewFarm(event)"><div class="field"><label>Nazwa gospodarstwa</label><input name="name" placeholder="np. Gospodarstwo 2" required></div>${formButtons()}</form>`)}
function saveNewFarm(e){e.preventDefault();const name=String(new FormData(e.target).get('name')||'').trim();if(!name)return;const id='farm_'+Date.now().toString(36);root.farms[id]=normalizeFarm({farmFields:[],parcels:[],operations:[],machines:[],finances:[],rain:[],notes:[],settings:{farmName:name,userName:name}});root.activeFarmId=id;db=root.farms[id];save();closeModal();render();toast('Dodano gospodarstwo: '+name)}

function renderFarmSwitcher(){const el=document.getElementById('farmSwitcher');if(!el)return;const opts=Object.entries(root.farms).map(([id,f])=>`<option value="${esc(id)}" ${id===root.activeFarmId?'selected':''}>${esc(farmName(f))}</option>`).join('');el.innerHTML=`<select onchange="switchFarm(this.value)" title="Gospodarstwo">${opts}</select><button onclick="addFarm()" title="Dodaj gospodarstwo">＋ Gospodarstwo</button>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0}).format(Number(n)||0)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}

function cloudLabel(){if(cloudState.status==='ready')return '☁️ Zsynchronizowano z chmurą';if(cloudState.status==='loading')return '☁️ Łączenie z chmurą…';if(cloudState.status==='saved')return '☁️ Zapisano w chmurze';if(cloudState.status==='migrated')return '☁️ Dane przeniesione do chmury';if(cloudState.status==='error')return '⚠️ Błąd synchronizacji';return '📱 Dane lokalne — zaloguj się do chmury'}

function ensureSettings(){db=normalizeFarm(db);db.settings=db.settings||{};if(!db.settings.userName)db.settings.userName=db.settings.farmName||DEFAULT_USER;if(!db.settings.farmName)db.settings.farmName=db.settings.userName||DEFAULT_USER;db.farmFields=db.farmFields||[];db.operations=db.operations||[];db.notes=db.notes||[];for(const o of db.operations){if(!o._id)o._id='op_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);o.implement=o.implement||'';o.variety=o.variety||''}for(const f of db.farmFields){f.history=f.history||[];f.parcels=f.parcels||[];f.variety=f.variety||'';f.harvest=f.harvest||{};f.soilTests=f.soilTests||[];f.currentSeason=Number(f.currentSeason||2026);normalizeOperationSeasons(f);repairStaleHarvest(f)}}
function userName(){ensureSettings();return db.settings.userName||DEFAULT_USER;}

function operationCostPerHa(o,f){if(o.costPerHa!==undefined&&o.costPerHa!=='')return Number(o.costPerHa)||0;const a=Number(f?.area||0);return a>0?(Number(o.cost||0)/a):0;}
function render(){const c=document.getElementById('content');const titles={dashboard:'Panel główny',fields:'Pola',parcels:'Działki ewidencyjne',machines:'Maszyny',operations:'Zabiegi',rain:'Opady',notes:'Notatnik',backup:'Ustawienia'};document.getElementById('title').textContent=selectedField?'Karta pola':titles[page];renderFarmSwitcher();if(selectedField)return fieldCard(c,selectedField);if(page==='dashboard')dashboard(c);if(page==='fields')fieldsPage(c);if(page==='parcels')parcelsPage(c);if(page==='machines')machinesPage(c);if(page==='operations')operationsPage(c);if(page==='rain')rainPage(c);if(page==='notes')notesPage(c);if(page==='backup')backupPage(c)}
const CROP_COLORS=['#1d4ed8','#dc2626','#059669','#7c3aed','#ea580c','#0891b2','#be123c','#4d7c0f','#c026d3','#475569','#0f766e','#b45309'];
function cropKey(c){return String(c||'Brak uprawy').trim()||'Brak uprawy'}
function cropColor(c){const k=cropKey(c).toLowerCase();const presets=[['kukurydza','#f4c430'],['rzepak','#e11d48'],['pszenżyto','#166534'],['pszenica','#2563eb'],['jęczmień','#f97316'],['żyto','#7c3aed'],['łubin','#06b6d4'],['tuz','#16a34a'],['groch','#92400e'],['soja','#db2777']];for(const [q,col] of presets)if(k.includes(q))return col;let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;return CROP_COLORS[h%CROP_COLORS.length]}
function cropStats(){const m={};for(const f of db.farmFields){const k=cropKey(f.crop);m[k]=(m[k]||0)+Number(f.area||0)}return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function cropChartHtml(){const stats=cropStats(),total=stats.reduce((s,x)=>s+x[1],0);if(!total)return '<div class="empty">Brak danych o uprawach.</div>';let deg=0,parts=[];for(const [crop,a] of stats){const d=a/total*360;parts.push(`${cropColor(crop)} ${deg}deg ${deg+d}deg`);deg+=d}const rows=stats.map(([crop,a])=>`<div class="crop-row"><span class="legend-dot" style="background:${cropColor(crop)}"></span><b>${esc(crop)}</b><span>${(a/total*100).toFixed(1)}% · ${a.toFixed(2)} ha</span></div>`).join('');return `<div class="cropchart"><div class="donut" style="background:conic-gradient(${parts.join(',')})"></div><div class="crop-list">${rows}</div></div>`}
function mapLegendHtml(){return cropStats().map(([crop])=>`<span class="legend-item"><span class="legend-dot" style="background:${cropColor(crop)}"></span>${esc(crop)}</span>`).join('')}
function dashboard(c){ensureSettings();const area=db.farmFields.reduce((sum,x)=>sum+Number(x.area||0),0);c.innerHTML=`<div class="dashhead"><div style="display:flex;align-items:center;gap:12px"><img src="icon-192.png" style="width:54px;height:54px;border-radius:14px;background:#fff;object-fit:contain;object-position:center;padding:2px" alt=""><div><div class="muted">AgroManager</div><h2>${esc(farmName())}</h2></div></div><div class="userchip"><div class="useravatar">${esc(userInitial())}</div><div style="flex:1"><div class="muted">Gospodarstwo</div><b>${esc(farmName())}</b><div class="muted" style="margin-top:2px">${esc(cloudLabel())}</div></div><button onclick="renameFarm()">Zmień</button></div></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><div class="muted">Powierzchnia pól</div><div class="metric">${area.toFixed(2)} ha</div></div><div class="card"><div class="muted">Liczba pól</div><div class="metric">${db.farmFields.length}</div></div></div><div class="section card"><h2 style="margin-top:0">🌾 Struktura upraw</h2>${cropChartHtml()}</div><div class="section card"><h2 style="margin-top:0">🛰️ Mapa gospodarstwa</h2><div id="dashboardMap" class="dashboard-map"></div><div class="legend" style="margin-top:12px">${mapLegendHtml()}</div><p id="dashboardMapStatus" class="muted">Pobieranie granic wszystkich pól z ULDK GUGiK…</p></div><div class="section"><h2>Pola</h2>${fieldTable(8)}</div>`;setTimeout(loadDashboardMap,100)}
function fieldTable(limit){let arr=limit?db.farmFields.slice(0,limit):db.farmFields;return `<div class="tablewrap"><table class="table"><thead><tr><th>Pole</th><th>Uprawa / sezon</th><th>Odmiana</th><th>Powierzchnia</th><th>Plon</th><th></th></tr></thead><tbody>${arr.map(f=>`<tr class="clickrow" onclick="openFieldCard('${esc(f.id)}')"><td><b>${esc(f.name||('Pole '+f.id))}</b></td><td>${esc(f.crop)} <span class="muted">(${Number(f.currentSeason||2026)})</span></td><td>${esc(f.variety||'—')}</td><td>${Number(f.area).toFixed(2)} ha</td><td>${currentHarvest(f).totalT?Number(currentHarvest(f).totalT).toFixed(2)+' t':'—'}</td><td><button onclick="event.stopPropagation();deleteField('${esc(f.id)}')">Usuń</button></td></tr>`).join('')}</tbody></table></div>`}

function isWinterCrop(crop){return /ozim/i.test(String(crop||''))}
function sowingSeason(date,crop){const y=Number(String(date||'').slice(0,4))||new Date().getFullYear();return y+(isWinterCrop(crop)?1:0)}
function opSeason(o){return Number(o.season||String(o.date||'').slice(0,4)||2026)}
function harvestSeason(hp){return Number(String(hp?.date||'').slice(0,4)||hp?.season||0)}
function fieldOperations(f){return (db.operations||[]).filter(o=>o.fieldId===f.id||String(o.field||'').startsWith(f.id+' —'))}
function normalizeOperationSeasons(f){const arr=fieldOperations(f).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));let active=0;for(const o of arr){if(o.kind==='Siew'){const ss=sowingSeason(o.date,o.crop);o.season=ss;active=ss;continue}const y=Number(String(o.date||'').slice(0,4)||f.currentSeason||2026);o.season=active||y}}
function currentHarvest(f){const hp=f?.harvest||{},hs=harvestSeason(hp),season=Number(f?.currentSeason||2026);return hp.totalT&&hs&&hs!==season?{}:hp}
function repairStaleHarvest(f){const hp=f?.harvest||{};if(!hp.totalT)return;const hs=harvestSeason(hp),current=Number(f.currentSeason||2026);if(!hs||hs===current){hp.season=current;return}let h=(f.history||[]).find(x=>Number(x.season)===hs);if(!h){h={season:hs};f.history.push(h)}const sow=(db.operations||[]).filter(o=>(o.fieldId===f.id||String(o.field||'').startsWith(f.id+' —'))&&o.kind==='Siew'&&opSeason(o)===hs).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))[0];if(!h.crop)h.crop=sow?.crop||'';if(!h.variety)h.variety=sow?.variety||'';h.area=Number(h.area||f.area||0);const y=Number(hp.yieldPerHa||((Number(hp.totalT||0)&&Number(f.area||0))?Number(hp.totalT)/Number(f.area):0));if(y)h.yield=y.toFixed(2);h.harvest={...hp,season:hs};h.notes=h.notes||'Zapis automatyczny po rozdzieleniu sezonów';f.harvest={}}
function archiveFieldSeason(f,season){season=Number(season||f.currentSeason||2026);const hp=currentHarvest(f);const yieldHa=Number(hp.yieldPerHa||((Number(hp.totalT||0)&&Number(f.area||0))?Number(hp.totalT)/Number(f.area):0));let h=(f.history||[]).find(x=>Number(x.season)===season);if(!h){h={season};f.history.push(h)}h.crop=f.crop||h.crop||'';h.variety=f.variety||h.variety||'';h.area=Number(f.area||0);if(yieldHa)h.yield=yieldHa.toFixed(2);if(Object.keys(hp).length)h.harvest={...hp,season};h.notes=h.notes||'Zapis automatyczny przy rozpoczęciu kolejnego sezonu'}
function startSowingSeason(f,x){const next=sowingSeason(x.date,x.crop);const prev=Number(f.currentSeason||2026);if(next!==prev||Object.keys(f.harvest||{}).length){archiveFieldSeason(f,prev);f.harvest={}}f.currentSeason=next;if(x.crop)f.crop=x.crop;f.variety=x.variety||'';return next}
function fieldCycleCosts(allOps,f,season){season=Number(season||f.currentSeason||2026);normalizeOperationSeasons(f);const cycleOps=allOps.slice().filter(o=>opSeason(o)===season).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));const hist=(f.history||[]).slice().sort((a,b)=>Number(a.season)-Number(b.season));const prev=hist.filter(h=>Number(h.season)<season&&h.harvest?.date).sort((a,b)=>Number(b.season)-Number(a.season))[0];const curr=season===Number(f.currentSeason||2026)?currentHarvest(f):(f.history||[]).find(h=>Number(h.season)===season)?.harvest||{};const start=prev?.harvest?.date||'';const end=curr?.date||'';const total=cycleOps.reduce((sum,o)=>sum+Number(o.cost||operationCostPerHa(o,f)*Number(f?.area||0)),0);const perHa=Number(f?.area||0)>0?total/Number(f.area):0;return{start,end,total,perHa,count:cycleOps.length}}
function fieldCard(c,id){const f=db.farmFields.find(x=>x.id===id);if(!f)return;const season=Number(f.currentSeason||2026);const allOps=db.operations.filter(o=>o.fieldId===id||String(o.field||'').startsWith(id+' —'));const ops=allOps.filter(o=>opSeason(o)===season);const hist=(f.history||[]).slice().sort((a,b)=>b.season-a.season);const soil=(f.soilTests||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const cycle=fieldCycleCosts(allOps,f,season);const hp=currentHarvest(f);const yieldHa=Number(hp.yieldPerHa||((Number(hp.totalT||0)&&Number(f.area||0))?Number(hp.totalT)/Number(f.area):0));const groups=[['Siew','🌱 Siew'],['Nawożenie','🧂 Nawożenie'],['Oprysk','🧪 Ochrona roślin'],['Uprawa','🚜 Uprawa gleby'],['Zbiór','🌾 Zbiór']];const groupHtml=groups.map(([kind,label])=>{const a=ops.filter(o=>o.kind===kind);return `<div class="card opgroup"><div class="fieldtitle"><h3>${label}</h3><button onclick="openOperation('${esc(f.id)}','${kind}')">＋</button></div>${a.length?a.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).map(o=>`<div class="opitem"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span><b>${esc(o.date)}</b>${o.variety?' · odm. '+esc(o.variety):''}${o.material?' · '+esc(o.material):''}${o.dose?' · '+esc(o.dose):''}${(o.costPerHa!==undefined||o.cost)?' · '+money(operationCostPerHa(o,f))+'/ha · razem '+money(o.cost||operationCostPerHa(o,f)*Number(f.area||0)):''}</span><button onclick="openOperation('','', '${esc(o._id)}')">Edytuj</button></div></div>`).join(''):'<div class="muted">Brak wpisów</div>'}</div>`}).join('');c.innerHTML=`<button class="back" onclick="selectedField=null;render()">← Wszystkie pola</button><div class="fieldtitle"><div><h2 style="margin:0">${esc(f.name||('Pole '+f.id))}</h2></div><div class="actions"><button onclick="editField('${esc(f.id)}')">Edytuj pole</button><button onclick="deleteField('${esc(f.id)}')">Usuń pole</button></div></div><div class="grid section"><div class="card"><div class="muted">Powierzchnia</div><div class="metric">${Number(f.area).toFixed(2)} ha</div></div><div class="card"><div class="muted">Uprawa ${season}</div><div class="metric" style="font-size:20px">${esc(f.crop||'—')}</div></div><div class="card"><div class="muted">Odmiana</div><div class="metric" style="font-size:20px">${esc(f.variety||'—')}</div></div><div class="card"><div class="muted">Plon ${season}</div><div class="metric" style="font-size:20px">${hp.totalT?Number(hp.totalT).toFixed(2)+' t':'—'}</div><div class="muted">${yieldHa?yieldHa.toFixed(2)+' t/ha':''}${hp.moisture?(yieldHa?' · ':'')+Number(hp.moisture).toFixed(1)+'% wilg.':''}</div></div></div><div class="two section"><div><div class="card"><h2 style="margin-top:0">🗺️ Mapa satelitarna pola</h2><div id="fieldMap" class="map"></div><p id="mapStatus" class="muted">Pobieranie granic działek z ULDK GUGiK…</p></div></div><div><div class="card"><h2 style="margin-top:0">Karta pola</h2><p><b>Powierzchnia:</b> ${Number(f.area).toFixed(2)} ha</p><p><b>Uprawa:</b> ${esc(f.crop||'—')}</p><p><b>Odmiana:</b> ${esc(f.variety||'—')}</p><p><b>Działki ewidencyjne:</b> ${f.parcels.length}</p><div class="parcel-list">${f.parcels.map(pid=>`<span class="pill">${esc((db.parcels.find(p=>p.identifier===pid)||{}).plot||pid)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="openGeoportal('${encodeURIComponent(f.parcels[0]||'')}')">Otwórz w Geoportalu</button></div></div></div></div><div class="section card"><div class="fieldtitle"><h2 style="margin:0">🌾 Zbiór ${season}</h2><button class="primary" onclick="openHarvest('${esc(f.id)}')">${hp.totalT?'Edytuj zbiór':'＋ Wpisz zbiór'}</button></div>${hp.totalT?`<div class="grid section"><div><div class="muted">Zebrano</div><b>${Number(hp.totalT).toFixed(2)} t</b></div><div><div class="muted">Plon</div><b>${yieldHa.toFixed(2)} t/ha</b></div><div><div class="muted">Wilgotność</div><b>${hp.moisture?Number(hp.moisture).toFixed(1)+'%':'—'}</b></div><div><div class="muted">Data zbioru</div><b>${esc(hp.date||'—')}</b></div></div>`:'<p class="muted">Nie wpisano jeszcze danych ze zbioru.</p>'}</div><div class="section card"><h2 style="margin-top:0">💰 Finanse pola</h2><div class="grid"><div><div class="muted">Koszty cyklu uprawowego</div><div class="metric">${money(cycle.total)}</div></div><div><div class="muted">Koszt / ha</div><div class="metric">${money(cycle.perHa)}/ha</div></div><div><div class="muted">Liczba pozycji kosztowych</div><div class="metric">${cycle.count}</div></div><div><div class="muted">Okres rozliczenia</div><div style="font-weight:700;margin-top:8px">${cycle.start?esc(cycle.start)+' → ':''}${cycle.end?esc(cycle.end):'do bieżącego dnia'}</div></div></div><p class="muted" style="margin-bottom:0">Koszty są liczone od poprzedniego zbioru do kolejnego zbioru. Do danego cyklu wliczany jest tylko zbiór kończący ten cykl.</p></div><div class="section card"><div class="fieldtitle"><h2 style="margin:0">🧪 Badania gleby</h2><button class="primary" onclick="openSoilTest('${esc(f.id)}')">＋ Dodaj wynik</button></div>${soil.length?`<div class="tablewrap section"><table class="table"><thead><tr><th>Data</th><th>pH</th><th>P [mg/kg]</th><th>K [mg/kg]</th><th>Mg</th><th>Uwagi</th></tr></thead><tbody>${soil.map(s=>`<tr><td><b>${esc(s.date||'—')}</b></td><td>${esc(s.ph||'—')}</td><td>${soilDisplayPK(s,'p')}</td><td>${soilDisplayPK(s,'k')}</td><td>${esc(s.mg||'—')}</td><td>${esc(s.notes||'—')}</td></tr>`).join('')}</tbody></table></div><p class="muted">P i K są prezentowane jako czyste składniki w mg/kg. Nowe wpisy są automatycznie przeliczane z wybranej formy i jednostki źródłowej; stare wpisy bez informacji o jednostce pozostają oznaczone jako nieprzeliczone.</p>`:'<p class="muted">Brak zapisanych badań gleby. Każdy kolejny wynik zostanie zachowany w historii.</p>'}</div><div class="section"><div class="fieldtitle"><h2>Prace w sezonie ${season}</h2><button class="primary" onclick="openOperation('${esc(f.id)}')">＋ Dodaj zabieg</button></div><div class="opgroups">${groupHtml}</div></div><div class="section"><div class="fieldtitle"><h2>Historia sezonów</h2><button class="primary" onclick="addSeason('${esc(f.id)}')">＋ Dodaj sezon</button></div>${hist.length?`<div class="tablewrap history-table"><table class="table"><thead><tr><th>Sezon</th><th>Uprawa</th><th>Zbiór</th><th>Plon</th><th>Odmiana</th><th>Powierzchnia</th><th>Uwagi</th></tr></thead><tbody>${hist.map(h=>`<tr><td><b>${h.season}</b></td><td><b>${esc(h.crop||'Brak danych')}</b></td><td><b>${h.harvest?.totalT?Number(h.harvest.totalT).toFixed(2)+' t':'Brak danych'}</b>${h.harvest?.date?'<div class="muted">'+esc(h.harvest.date)+'</div>':''}</td><td><b>${h.yield?esc(h.yield)+' t/ha':'Brak danych'}</b></td><td>${esc(h.variety||'—')}</td><td>${Number(h.area||f.area).toFixed(2)} ha</td><td>${esc(h.notes||'—')}</td></tr>`).join('')}</tbody></table></div><div class="history-cards">${hist.map(h=>`<div class="history-card"><div class="history-card-head"><div><div class="muted">Sezon ${h.season}</div><div class="history-crop">🌾 ${esc(h.crop||'Brak danych')}</div></div><div style="text-align:right"><div class="muted">Plon</div><div class="history-yield">${h.yield?esc(h.yield)+' t/ha':'Brak danych'}</div></div></div><div class="history-meta"><div><span class="muted">Zbiór</span><br><b>${h.harvest?.totalT?Number(h.harvest.totalT).toFixed(2)+' t':'—'}</b>${h.harvest?.date?'<br><span class="muted">'+esc(h.harvest.date)+'</span>':''}</div><div><span class="muted">Odmiana</span><br><b>${esc(h.variety||'—')}</b></div><div><span class="muted">Powierzchnia</span><br><b>${Number(h.area||f.area).toFixed(2)} ha</b></div></div>${h.notes?`<div class="muted" style="margin-top:10px">${esc(h.notes)}</div>`:''}</div>`).join('')}</div>`:'<div class="card muted">Brak zapisanych poprzednich sezonów.</div>'}</div><div class="section"><h2>Pełna historia zabiegów</h2>${operationTable(allOps)}</div>`;setTimeout(()=>loadMap(id),100)}
function wktToLatLngs(wkt){const groups=[];const body=wkt.replace(/^MULTIPOLYGON\s*\(\s*\(\s*\(/i,'').replace(/^POLYGON\s*\(\s*\(/i,'').replace(/\)\s*\)\s*\)?\s*$/,'');for(const ring of body.split(/\)\s*\)\s*,\s*\(\s*\(/)){const pts=ring.replace(/[()]/g,'').split(',').map(p=>{const [x,y]=p.trim().split(/\s+/).map(Number);return [y,x]}).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(pts.length)groups.push(pts)}return groups}
const parcelGeomCache={};
async function getParcelRings(pid){if(parcelGeomCache[pid])return parcelGeomCache[pid];try{const url='https://uldk.gugik.gov.pl/?request=GetParcelById&id='+encodeURIComponent(pid)+'&result=geom_wkt&srid=4326';const txt=await fetch(url).then(r=>r.text());const wkt=(txt.split('|').find(x=>/POLYGON/i.test(x))||txt.match(/MULTIPOLYGON\s*\(.+|POLYGON\s*\(.+/i)?.[0]||'').trim();const rings=wkt?wktToLatLngs(wkt):[];parcelGeomCache[pid]=rings;return rings}catch(e){return []}}
async function loadDashboardMap(){const el=document.getElementById('dashboardMap'),status=document.getElementById('dashboardMapStatus');if(!el)return;if(typeof L==='undefined'){status.textContent='Nie udało się załadować biblioteki mapy. Sprawdź połączenie z internetem.';return}if(mapObj){mapObj.remove();mapObj=null}mapObj=L.map(el).setView([53.3,22.9],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Zdjęcia: Esri'}).addTo(mapObj);const layers=[];let count=0;for(const f of db.farmFields){const col=cropColor(f.crop);for(const pid of [...new Set(f.parcels||[])]){const rings=await getParcelRings(pid);for(const ring of rings){const poly=L.polygon(ring,{color:col,weight:3,fillColor:col,fillOpacity:.38}).addTo(mapObj);poly.bindTooltip(`${f.name||('Pole '+f.id)} · ${f.crop||'—'} · ${Number(f.area||0).toFixed(2)} ha`);poly.on('click',()=>openFieldCard(f.id));layers.push(poly);count++}}}if(layers.length){mapObj.fitBounds(L.featureGroup(layers).getBounds().pad(.08));status.textContent='Podświetlono '+count+' obrysów działek kolorami według upraw. Kliknij pole, aby otworzyć kartę.'}else status.textContent='Nie udało się pobrać granic z ULDK. Mapa wymaga dostępu do internetu.'}
async function loadMap(id){const el=document.getElementById('fieldMap'),status=document.getElementById('mapStatus');if(!el)return;if(typeof L==='undefined'){status.textContent='Nie udało się załadować biblioteki mapy. Sprawdź połączenie z internetem.';return}if(mapObj){mapObj.remove();mapObj=null}mapObj=L.map(el).setView([53.3,22.9],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Zdjęcia: Esri'}).addTo(mapObj);const f=db.farmFields.find(x=>x.id===id);const layers=[];for(const pid of f.parcels){const rings=await getParcelRings(pid);for(const ring of rings){const poly=L.polygon(ring,{color:'#16a34a',weight:3,fillColor:'#22c55e',fillOpacity:.28}).addTo(mapObj);poly.bindTooltip(pid);layers.push(poly)}}if(layers.length){mapObj.fitBounds(L.featureGroup(layers).getBounds().pad(.15));status.textContent='Podświetlono '+layers.length+' granic działek składających się na to pole.'}else status.textContent='Nie udało się automatycznie pobrać granic z ULDK. Mapa satelitarna wymaga internetu.'}

function modal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function formButtons(){return `<div class="actions" style="margin-top:15px;justify-content:flex-end"><button type="button" onclick="closeModal()">Anuluj</button><button class="primary" type="submit">Zapisz</button></div>`}
function editField(id){const f=db.farmFields.find(x=>x.id===id);modal('Edytuj pole',`<form onsubmit="saveFieldEdit(event,'${esc(id)}')"><div class="form"><div class="field"><label>Nazwa pola</label><input name="name" value="${esc(f.name||'')}"></div><div class="field"><label>Powierzchnia (ha)</label><input name="area" type="number" step="0.01" min="0" value="${Number(f.area||0).toFixed(2)}" required></div><div class="field"><label>Uprawa 2026</label><input name="crop" value="${esc(f.crop||'')}"></div><div class="field"><label>Odmiana 2026</label><input name="variety" value="${esc(f.variety||'')}"></div><div class="field full"><label>Identyfikatory działek ewidencyjnych</label><textarea name="parcels" rows="7" placeholder="Jeden pełny identyfikator w każdym wierszu">${esc((f.parcels||[]).join('\n'))}</textarea><div class="muted" style="margin-top:5px">Np. 200804_4.0054.86/1. Te numery są używane również do pobierania granic na mapie.</div></div></div>${formButtons()}</form>`)}
function saveFieldEdit(e,id){e.preventDefault();const f=db.farmFields.find(x=>x.id===id),d=new FormData(e.target);f.name=d.get('name');f.area=Number(d.get('area'));f.crop=d.get('crop');f.variety=d.get('variety');f.parcels=[...new Set(String(d.get('parcels')||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))];for(const pid of f.parcels){if(!db.parcels.some(p=>p.identifier===pid))db.parcels.push({plot:parcelShort(pid),identifier:pid,area:0,arableArea:0,crop:f.crop||'',variety:f.variety||'',yield:'',precinct:'',gmina:'',cropParts:[],source:'ręcznie'})}save();closeModal();render();toast('Pole zapisane')}
function deleteField(id){const f=db.farmFields.find(x=>x.id===id);if(!f)return;const opCount=db.operations.filter(o=>o.fieldId===id).length;if(!confirm(`Usunąć ${f.name||('Pole '+id)}?\n\nUsunięta zostanie karta pola, historia sezonów oraz ${opCount} przypisanych zabiegów. Tej operacji nie można cofnąć bez kopii danych.`))return;db.operations=db.operations.filter(o=>o.fieldId!==id);db.farmFields=db.farmFields.filter(x=>x.id!==id);if(selectedField===id)selectedField=null;save();render();toast('Pole usunięte')}

function mergeFields(e){e.preventDefault();const d=new FormData(e.target),targetId=d.get('target'),sourceIds=d.getAll('sources').filter(x=>x!==targetId);if(!sourceIds.length){alert('Wybierz przynajmniej jedno inne pole do połączenia.');return}const target=db.farmFields.find(f=>f.id===targetId);const sources=db.farmFields.filter(f=>sourceIds.includes(f.id));if(!target||!sources.length)return;const names=sources.map(f=>f.name||('Pole '+f.id)).join(', ');if(!confirm(`Połączyć z polem „${target.name||('Pole '+target.id)}”: ${names}?`))return;target.area=Number(target.area||0)+sources.reduce((s,f)=>s+Number(f.area||0),0);target.parcels=[...new Set([...(target.parcels||[]),...sources.flatMap(f=>f.parcels||[])])];target.history=[...(target.history||[]),...sources.flatMap(f=>f.history||[])];target.mergedFrom=[...new Set([...(target.mergedFrom||[]),...sourceIds,...sources.flatMap(f=>f.mergedFrom||[])])];for(const o of db.operations){if(sourceIds.includes(o.fieldId)){o.fieldId=targetId;o.fieldName=target.name||targetId}}db.farmFields=db.farmFields.filter(f=>!sourceIds.includes(f.id));selectedField=targetId;save();closeModal();render();toast('Pola połączone')}

function financesPage(c){const co=db.finances.filter(x=>x.type==='cost').reduce((s,x)=>s+Number(x.amount||0),0),inc=db.finances.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);c.innerHTML=`<div class="grid"><div class="card"><div class="muted">Przychody</div><div class="metric">${money(inc)}</div></div><div class="card"><div class="muted">Koszty</div><div class="metric">${money(co)}</div></div><div class="card"><div class="muted">Wynik</div><div class="metric">${money(inc-co)}</div></div></div><div class="section"><button class="primary" onclick="openFinance()">＋ Dodaj pozycję</button></div>`}function openFinance(){modal('Dodaj pozycję finansową',`<form onsubmit="saveFinance(event)"><div class="form"><div class="field"><label>Data</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Typ</label><select name="type"><option value="cost">Koszt</option><option value="income">Przychód</option></select></div><div class="field"><label>Kategoria</label><input name="category"></div><div class="field"><label>Kwota</label><input name="amount" type="number" step=".01" required></div><div class="field full"><label>Opis</label><input name="note"></div></div>${formButtons()}</form>`)}function saveFinance(e){e.preventDefault();db.finances.push(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}
function notesPage(c){ensureSettings();const notes=(db.notes||[]).slice().sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));c.innerHTML=`<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="openNote()">＋ Dodaj notatkę</button></div>${notes.length?notes.map(n=>`<div class="card section note-card"><div style="flex:1"><h3>${esc(n.title||'Bez tytułu')}</h3><div class="muted">${esc((n.updatedAt||n.createdAt||'').slice(0,10))}</div><div class="note-body" style="margin-top:10px">${esc(n.body||'')}</div></div><div class="actions"><button onclick="openNote('${esc(n._id)}')">Edytuj</button><button onclick="deleteNote('${esc(n._id)}')">Usuń</button></div></div>`).join(''):'<div class="card empty">Brak notatek. Dodaj pierwszą informację, przypomnienie lub plan prac.</div>'}`}
function openNote(id=''){const n=id?(db.notes||[]).find(x=>x._id===id):null;modal(n?'Edytuj notatkę':'Nowa notatka',`<form onsubmit="saveNote(event,'${esc(id)}')"><div class="form"><div class="field full"><label>Tytuł</label><input name="title" value="${esc(n?.title||'')}" placeholder="np. Plan nawożenia"></div><div class="field full"><label>Treść</label><textarea name="body" rows="9" required placeholder="Zapisz dowolną informację…">${esc(n?.body||'')}</textarea></div></div>${formButtons()}</form>`)}
function saveNote(e,id=''){e.preventDefault();const x=Object.fromEntries(new FormData(e.target)),now=new Date().toISOString();if(id){const i=db.notes.findIndex(n=>n._id===id);if(i>=0)x.createdAt=db.notes[i].createdAt||now;x.updatedAt=now;x._id=id;if(i>=0)db.notes[i]=x;else db.notes.push(x)}else{x._id='note_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);x.createdAt=now;x.updatedAt=now;db.notes.push(x)}save();closeModal();render();toast('Notatka zapisana')}

function backupPage(c){const logged=!!cloudState.user;c.innerHTML=`<div class="card farm-card"><h2>🏡 Gospodarstwa</h2><p>Aktywne: <b>${esc(farmName())}</b>. Jedno konto może prowadzić kilka oddzielnych gospodarstw.</p><div class="actions"><button class="primary" onclick="addFarm()">＋ Dodaj gospodarstwo</button><button onclick="renameFarm()">Zmień nazwę</button></div></div><div class="section card"><h2>📥 Import z ARiMR / eWniosek</h2><p>Wczytaj pliki CSV <b>uprawy</b> oraz <b>działkiReferencyjne</b>. Dane trafią do aktualnie wybranego gospodarstwa: <b>${esc(farmName())}</b>.</p><div class="actions"><button class="primary" onclick="document.getElementById('arimrFiles').click()">📂 Wybierz pliki agencyjne</button><input id="arimrFiles" type="file" accept=".csv,text/csv" multiple style="display:none" onchange="importARiMRFiles(event)"></div><p class="muted">Przed zatwierdzeniem zobaczysz liczbę wykrytych pól, działek i powierzchnię. Import nie wysyła nic do ARiMR — odczytuje tylko pliki zapisane na urządzeniu.</p></div><div class="section card"><h2>📄 Ewidencja zabiegów ochrony roślin</h2><p>Urzędowy wydruk jest tworzony automatycznie ze wszystkich zabiegów oznaczonych jako <b>Oprysk</b>.</p><div class="form" style="max-width:520px"><div class="field"><label>Rok raportu</label><input id="reportYear" type="number" min="2000" max="2100" value="${new Date().getFullYear()}"></div><div class="field" style="align-self:end"><button class="primary" onclick="printPlantProtectionReport()">🖨️ Drukuj / zapisz PDF</button></div></div><p class="muted">Raport zawiera datę, pole, powierzchnię, uprawę, środek, dawkę, wodę, przyczynę zabiegu oraz zestaw maszyna + narzędzie.</p></div><div class="section card"><h2>📱 Aplikacja na telefon</h2><p>AgroManager może działać jako aplikacja PWA z ikoną na ekranie głównym.</p><div class="actions"><button id="installAppBtn" class="primary" onclick="installAgroManager()" style="display:none">⬇ Zainstaluj AgroManager</button></div><div id="installHelp" class="install-note">Jeżeli przycisk instalacji się nie pojawi, otwórz menu przeglądarki i wybierz „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.</div></div><div class="section card"><h2>☁️ Chmura Google / Firebase</h2><p><b>${esc(cloudLabel())}</b></p>${logged?`<p class="muted">Konto: ${esc(cloudAccount())}</p><div class="actions"><button class="primary" onclick="cloudSaveNow()">☁️ Zapisz teraz</button><button onclick="cloudLogout()">Wyloguj z chmury</button></div>`:`<p>Dane są nadal bezpiecznie zapisywane lokalnie. Zaloguj się przez Google, aby utworzyć prywatną kopię w Firestore i synchronizować zmiany.</p><button class="primary" onclick="cloudLogin()">G Zaloguj przez Google</button>`}<div class="install-note" style="margin-top:12px">Synchronizowane są wszystkie gospodarstwa przypisane do tego konta.</div></div><div class="section card"><h2>🔐 Kopia ręczna</h2><p>Eksport JSON obejmuje wszystkie gospodarstwa.</p><div class="actions"><button class="primary" onclick="exportData()">⬇ Eksportuj kopię</button><button onclick="document.getElementById('file').click()">⬆ Importuj kopię</button><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div>`;refreshInstallButton()}
function exportData(){const b=new Blob([JSON.stringify(root,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agromanager-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{root=normalizeRoot(JSON.parse(r.result));db=root.farms[root.activeFarmId];ensureSettings();save();render();toast('Kopia odtworzona')}catch{alert('Nieprawidłowa kopia')}};r.readAsText(f)}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=(text.split(/\r?\n/)[0]||'');const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===d&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[]}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}if(rows.length<2)return[];const h=rows[0].map(x=>String(x).trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]??'').trim()]))) }
function numPL(v){return Number(String(v??'').replace(/\s/g,'').replace(',','.'))||0}
async function importARiMRFiles(e){const files=[...(e.target.files||[])];if(!files.length)return;let up=[],dz=[];for(const f of files){const rows=parseCSV(await f.text());if(rows.some(r=>'Oznaczenie Uprawy / działki rolnej' in r))up=up.concat(rows);if(rows.some(r=>'Identyfikator działki ewidencyjnej' in r))dz=dz.concat(rows)}if(!up.length){alert('Nie rozpoznano pliku „uprawy”. Wybierz eksport CSV z eWniosek/ARiMR.');e.target.value='';return}const groups={};for(const r of up){const id=r['Oznaczenie Uprawy / działki rolnej'];if(!id)continue;if(!groups[id])groups[id]={id,name:'Pole '+id,area:numPL(r['Powierzchnia [ha]']),crop:r['Roślina uprawna']||'',variety:r['Odmiana uprawy']||'',parcels:[],payments:r['Lista płatności']||'',ecoschemes:r['Lista ekoschematów']||'',history:[],harvest:{},soilTests:[]};const pid=r['Nr działki ewidencyjnej'];if(pid&&!groups[id].parcels.includes(pid))groups[id].parcels.push(pid)}const fields=Object.values(groups);const parcelMap={};for(const r of dz){const id=r['Identyfikator działki ewidencyjnej'];if(!id)continue;parcelMap[id]={plot:r['Nr działki ewidencyjnej']||id.split('.').pop(),identifier:id,area:numPL(r['Hektar kwalifikujący się ogółem na działce [ha]']),arableArea:numPL(r['Pow. gruntów ornych ogółem na działce [ha]']),precinct:r['Nazwa obrębu ewidencyjnego']||'',gmina:r['Gmina']||'',source:'ARiMR import'}}for(const r of up){const pid=r['Nr działki ewidencyjnej'];if(!pid)continue;if(!parcelMap[pid])parcelMap[pid]={plot:pid.split('.').pop(),identifier:pid,area:0,arableArea:0,precinct:'',gmina:'',source:'ARiMR import'};parcelMap[pid].cropParts=parcelMap[pid].cropParts||[];const part={designation:r['Oznaczenie Uprawy / działki rolnej'],crop:r['Roślina uprawna'],cropArea:numPL(r['Powierzchnia uprawy w granicach działki ewidencyjnej - ha'])};if(!parcelMap[pid].cropParts.some(x=>x.designation===part.designation))parcelMap[pid].cropParts.push(part)}const area=fields.reduce((a,f)=>a+Number(f.area||0),0);const replace=confirm(`Wykryto ${fields.length} pól (${area.toFixed(2)} ha) oraz ${Object.keys(parcelMap).length} działek ewidencyjnych.

OK = zastąp pola/działki w aktywnym gospodarstwie danymi z ARiMR.
Anuluj = nie importuj.`);if(!replace){e.target.value='';return}db.farmFields=fields;db.parcels=Object.values(parcelMap);ensureSettings();save();render();toast('Import ARiMR zakończony: '+fields.length+' pól');e.target.value=''}

function reportEsc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function printPlantProtectionReport(){
  const year=String(document.getElementById('reportYear')?.value||new Date().getFullYear());
  const ops=(db.operations||[]).filter(o=>o.kind==='Oprysk'&&String(o.date||'').startsWith(year+'-')).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  if(!ops.length){alert('Brak zapisanych zabiegów typu „Oprysk” w roku '+year+'.');return}
  const rows=ops.map((o,i)=>{const f=db.farmFields.find(x=>x.id===o.fieldId);const area=Number(f?.area||0);return `<tr><td>${i+1}</td><td>${reportEsc(o.date||'—')}</td><td>${reportEsc(f?.name||o.fieldName||o.field||'—')}</td><td>${area?area.toFixed(2):'—'}</td><td>${reportEsc(f?.crop||'—')}</td><td>${reportEsc(o.material||'—')}</td><td>${reportEsc(o.dose||'—')}</td><td>${reportEsc(o.water||'—')}</td><td>${reportEsc(o.reason||'—')}</td><td>${reportEsc(o.machine||'—')}</td><td>${reportEsc(o.implement||'—')}</td></tr>`}).join('');
  const totalArea=[...new Set(ops.map(o=>o.fieldId).filter(Boolean))].reduce((sum,id)=>sum+Number(db.farmFields.find(f=>f.id===id)?.area||0),0);
  const html=`<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Ewidencja zabiegów ochrony roślin ${reportEsc(year)}</title><style>@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:0;font-size:10px}h1{text-align:center;font-size:17px;margin:0 0 4px}h2{text-align:center;font-size:12px;font-weight:normal;margin:0 0 14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;margin-bottom:12px;font-size:11px}.meta div{border-bottom:1px solid #888;padding:4px 0}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #555;padding:4px 3px;vertical-align:top;word-wrap:break-word}th{background:#eee;font-size:9px}td:nth-child(1){text-align:center;width:3%}td:nth-child(2){width:8%}.foot{margin-top:14px;display:flex;justify-content:space-between;gap:30px}.sign{width:260px;border-top:1px solid #555;text-align:center;padding-top:4px;margin-top:28px}.note{margin-top:9px;font-size:8px;color:#444}@media print{button{display:none}}.top{position:relative;justify-content:flex-end;min-height:48px}.top h1{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.card,.tablewrap,.modalbox,.mobilebar{background:var(--card)}button,.field input,.field select,.field textarea,.farmbar select{background:#2c312d;color:var(--text);border-color:var(--line)}.table th,.notice,.costpreview,.soil-preview,.install-note{background:#292e2a;color:var(--text)}.clickrow:hover{background:#303631}.donut:after{background:var(--card)}@media(max-width:900px){.top{padding-top:52px;justify-content:center}.top h1{top:0}.actions{justify-content:center}}
</style></head><body><h1>EWIDENCJA ZABIEGÓW ŚRODKAMI OCHRONY ROŚLIN</h1><h2>Rok ${reportEsc(year)}</h2><div class="meta"><div><b>Profesjonalny użytkownik / gospodarstwo:</b> ${reportEsc(farmName())}</div><div><b>Liczba zabiegów:</b> ${ops.length}</div><div><b>Rok prowadzenia ewidencji:</b> ${reportEsc(year)}</div><div><b>Łączna powierzchnia unikalnych pól w raporcie:</b> ${totalArea.toFixed(2)} ha</div></div><table><thead><tr><th>Lp.</th><th>Data</th><th>Pole / obszar</th><th>Pow. [ha]</th><th>Uprawa</th><th>Środek ochrony roślin</th><th>Dawka / ha</th><th>Woda / ha</th><th>Przyczyna wykonania zabiegu / integrowana ochrona</th><th>Maszyna / ciągnik</th><th>Narzędzie / maszyna współpracująca</th></tr></thead><tbody>${rows}</tbody></table><div class="foot"><div><div class="note">Wydruk wygenerowany z aplikacji AgroManager: ${new Date().toLocaleString('pl-PL')}.</div></div><div class="sign">podpis prowadzącego ewidencję</div></div><div class="note">Ewidencja została zestawiona z wpisów oznaczonych w AgroManagerze jako „Oprysk”. Przed okazaniem dokumentu sprawdź kompletność danych, w szczególności nazwę środka, dawkę, obszar/uprawę oraz przyczynę wykonania zabiegu.</div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
  const w=window.open('','_blank');if(!w){alert('Przeglądarka zablokowała okno wydruku. Zezwól AgroManagerowi na wyskakujące okna i spróbuj ponownie.');return}w.document.open();w.document.write(html);w.document.close();
}

if('serviceWorker' in navigator){
  let reloadingForUpdate=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadingForUpdate)return;
    reloadingForUpdate=true;
    location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      const check=()=>reg.update().catch(()=>{});
      check();
      setInterval(check,60*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    }catch(err){console.warn('Service Worker:',err)}
