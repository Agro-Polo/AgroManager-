<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtWzC9e5dLSjmnFONVQ_d6JwSOb2OzhQA",
  authDomain: "agromanager-2d113.firebaseapp.com",
  projectId: "agromanager-2d113",
  storageBucket: "agromanager-2d113.firebasestorage.app",
  messagingSenderId: "968764019693",
  appId: "1:968764019693:web:4477bd3a553e035e1c4de4",
  measurementId: "G-K3RG4W61TD"
};

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);
const firestore = getFirestore(firebaseApp);
const provider = new GoogleAuthProvider();
let cloudReady = false;
let currentUser = null;
let pendingTimer = null;

function fire(name, detail={}) { window.dispatchEvent(new CustomEvent(name,{detail})); }
async function stateRef(user){ return doc(firestore,'users',user.uid,'app','state'); }

window.agroCloud = {
  async login(){
    try { await signInWithPopup(firebaseAuth, provider); }
    catch(err){
      if(['auth/popup-blocked','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment'].includes(err?.code)) {
        await signInWithRedirect(firebaseAuth, provider);
      } else { throw err; }
    }
  },
  async logout(){ await signOut(firebaseAuth); },
  getUser(){ return currentUser; },
  isReady(){ return cloudReady; },
  scheduleSave(data){
    if(!currentUser || !cloudReady) return;
    clearTimeout(pendingTimer);
    pendingTimer=setTimeout(async()=>{
      try{
        await setDoc(await stateRef(currentUser), {data: JSON.parse(JSON.stringify(data)), updatedAt: serverTimestamp()}, {merge:true});
        fire('agro-cloud-status',{status:'saved',user:currentUser});
      }catch(error){ fire('agro-cloud-status',{status:'error',user:currentUser,error}); }
    },450);
  },
  async saveNow(data){
    if(!currentUser) throw new Error('Najpierw zaloguj się do Google.');
    await setDoc(await stateRef(currentUser), {data: JSON.parse(JSON.stringify(data)), updatedAt: serverTimestamp()}, {merge:true});
    fire('agro-cloud-status',{status:'saved',user:currentUser});
  }
};

try { await setPersistence(firebaseAuth,browserLocalPersistence); } catch(e) { console.warn('Firebase persistence:',e); }

onAuthStateChanged(firebaseAuth, async user => {
  currentUser=user||null; cloudReady=false;
  if(!user){ fire('agro-cloud-auth',{user:null,status:'offline'}); return; }
  fire('agro-cloud-auth',{user,status:'loading'});
  try{
    const snap=await getDoc(await stateRef(user));
    if(snap.exists() && snap.data()?.data){
      fire('agro-cloud-data',{data:snap.data().data,user});
    }else if(typeof window.getAgroData==='function'){
      await setDoc(await stateRef(user), {data: JSON.parse(JSON.stringify(window.getAgroData())), updatedAt: serverTimestamp()}, {merge:true});
      fire('agro-cloud-status',{status:'migrated',user});
    }
    cloudReady=true;
    fire('agro-cloud-auth',{user,status:'ready'});
  }catch(error){
    console.error('Firestore load:',error);
    fire('agro-cloud-status',{status:'error',user,error});
  }
});
</script>

v><div class="card"><div class="muted">Uprawa 2026</div><div class="metric" style="font-size:20px">${esc(f.crop||'—')}</div></div><div class="card"><div class="muted">Odmiana</div><div class="metric" style="font-size:20px">${esc(f.variety||'—')}</div></div><div class="card"><div class="muted">Plon 2026</div><div class="metric" style="font-size:20px">${hp.totalT?Number(hp.totalT).toFixed(2)+' t':'—'}</div><div class="muted">${yieldHa?yieldHa.toFixed(2)+' t/ha':''}${hp.moisture?(yieldHa?' · ':'')+Number(hp.moisture).toFixed(1)+'% wilg.':''}</div></div></div><div class="two section"><div><div class="card"><h2 style="margin-top:0">🗺️ Mapa satelitarna pola</h2><div id="fieldMap" class="map"></div><p id="mapStatus" class="muted">Pobieranie granic działek z ULDK GUGiK…</p></div></div><div><div class="card"><h2 style="margin-top:0">Karta pola</h2><p><b>Powierzchnia:</b> ${Number(f.area).toFixed(2)} ha</p><p><b>Uprawa:</b> ${esc(f.crop||'—')}</p><p><b>Odmiana:</b> ${esc(f.variety||'—')}</p><p><b>Działki ewidencyjne:</b> ${f.parcels.length}</p><div class="parcel-list">${f.parcels.map(pid=>`<span class="pill">${esc((db.parcels.find(p=>p.identifier===pid)||{}).plot||pid)}</span>`).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="openGeoportal('${encodeURIComponent(f.parcels[0]||'')}')">Otwórz w Geoportalu</button></div></div></div></div><div class="section card"><div class="fieldtitle"><h2 style="margin:0">🌾 Zbiór 2026</h2><button class="primary" onclick="openHarvest('${esc(f.id)}')">${hp.totalT?'Edytuj zbiór':'＋ Wpisz zbiór'}</button></div>${hp.totalT?`<div class="grid section"><div><div class="muted">Zebrano</div><b>${Number(hp.totalT).toFixed(2)} t</b></div><div><div class="muted">Plon</div><b>${yieldHa.toFixed(2)} t/ha</b></div><div><div class="muted">Wilgotność</div><b>${hp.moisture?Number(hp.moisture).toFixed(1)+'%':'—'}</b></div><div><div class="muted">Data zbioru</div><b>${esc(hp.date||'—')}</b></div></div>`:'<p class="muted">Nie wpisano jesz function wktToLatLngs(wkt){const groups=[];const body=wkt.replace(/^MULTIPOLYGON\s*\(\s*\(\s*\(/i,'').replace(/^POLYGON\s*\(\s*\(/i,'').replace(/\)\s*\)\s*\)?\s*$/,'');for(const ring of body.split(/\)\s*\)\s*,\s*\(\s*\(/)){const pts=ring.replace(/[()]/g,'').split(',').map(p=>{const [x,y]=p.trim().split(/\s+/).map(Number);return [y,x]}).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(pts.length)groups.push(pts)}return groups}
const parcelGeomCache={};
async function getParcelRings(pid){if(parcelGeomCache[pid])return parcelGeomCache[pid];try{const url='https://uldk.gugik.gov.pl/?request=GetParcelById&id='+encodeURIComponent(pid)+'&result=geom_wkt&srid=4326';const txt=await fetch(url).then(r=>r.text());const wkt=(txt.split('|').find(x=>/POLYGON/i.test(x))||txt.match(/MULTIPOLYGON\s*\(.+|POLYGON\s*\(.+/i)?.[0]||'').trim();const rings=wkt?wktToLatLngs(wkt):[];parcelGeomCache[pid]=rings;return rings}catch(e){return []}}
async function loadDashboardMap(){const el=document.getElementById('dashboardMap'),status=document.getElementById('dashboardMapStatus');if(!el)return;if(typeof L==='undefined'){status.textContent='Nie udało się załadować biblioteki mapy. Sprawdź połączenie z internetem.';return}if(mapObj){mapObj.remove();mapObj=null}mapObj=L.map(el).setView([53.3,22.9],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Zdjęcia: Esri'}).addTo(mapObj);const layers=[];let count=0;for(const f of db.farmFields){for(const pid of [...new Set(f.parcels||[])]){const rings=await getParcelRings(pid);for(const ring of rings){const poly=L.polygon(ring,{color:'#16a34a',weight:2,fillColor:'#22c55e',fillOpacity:.25}).addTo(mapObj);poly.bindTooltip(`${f.name||('Pole '+f.id)} · ${Number(f.area||0).toFixed(2)} ha`);poly.on('click',()=>openFieldCard(f.id));layers.push(poly);count++}}}if(layers.length){mapObj.fitBounds(L.featureGroup(layers).getBounds().pad(.08));status.textContent='Podświetlono '+count+' obrysów działek. Kliknij wybrany obrys, aby otworzyć kartę pola.'}else status.textContent='Nie udało się pobrać granic z ULDK. Mapa wymaga dostępu do internetu.'}
async function loadMap(id){const el=document.getElementById('fieldMap'),status=document.getElementById('mapStatus');if(!el)return;if(typeof L==='undefined'){status.textContent='Nie udało się załadować biblioteki mapy. Sprawdź połączenie z internetem.';return}if(mapObj){mapObj.remove();mapObj=null}mapObj=L.map(el).setView([53.3,22.9],10);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Zdjęcia: Esri'}).addTo(mapObj);const f=db.farmFields.find(x=>x.id===id);const layers=[];for(const pid of f.parcels){const rings=await getParcelRings(pid);for(const ring of rings){const poly=L.polygon(ring,{color:'#16a34a',weight:3,fillColor:'#22c55e',fillOpacity:.28}).addTo(mapObj);poly.bindTooltip(pid);layers.push(poly)}}if(layers.length){mapObj.fitBounds(L.featureGroup(layers).getBounds().pad(.15));status.textContent='Podświetlono '+layers.length+' granic działek składających się na to pole.'}else status.textContent='Nie udało się automatycznie pobrać granic z ULDK. Mapa satelitarna wymaga internetu.'}

function editField(id){const f=db.farmFields.find(x=>x.id===id);modal('Edytuj pole',`<form onsubmit="saveFieldEdit(event,'${esc(id)}')"><div class="form"><div class="field"><label>Nazwa pola</label><input name="name" value="${esc(f.name||'')}"></div><div class="field"><label>Powierzchnia (ha)</label><input name="area" type="number" step="0.01" min="0" value="${Number(f.area||0).toFixed(2)}" required></div><div class="field"><label>Uprawa 2026</label><input name="crop" value="${esc(f.crop||'')}"></div><div class="field"><label>Odmiana 2026</label><input name="variety" value="${esc(f.variety||'')}"></div><div class="field full"><label>Identyfikatory działek ewidencyjnych</label><textarea name="parcels" rows="7" placeholder="Jeden pełny identyfikator w każdym wierszu">${esc((f.parcels||[]).join('\n'))}</textarea><div class="muted" style="margin-top:5px">Np. 200804_4.0054.86/1. Te numery są używane również do pobierania granic na mapie.</div></div></div>${formButtons()}</form>`)}
function saveFieldEdit(e,id){e.preventDefault();const f=db.farmFields.find(x=>x.id===id),d=new FormData(e.target);f.name=d.get('name');f.area=Number(d.get('area'));f.crop=d.get('crop');f.variety=d.get('variety');f.parcels=[...new Set(String(d.get('parcels')||'').split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))];for(const pid of f.parcels){if(!db.parcels.some(p=>p.identifier===pid))db.parcels.push({plot:parcelShort(pid),identifier:pid,area:0,arableArea:0,crop:f.crop||'',variety:f.variety||'',yield:'',precinct:'',gmina:'',cropParts:[],source:'ręcznie'})}save();closeModal();render();toast('Pole zapisane')}
function deleteField(id){const f=db.farmFields.find(x=>x.id===id);if(!f)return;const opCount=db.operations.filter(o=>o.fieldId===id).length;if(!confirm(`Usunąć ${f.name||('Pole '+id)}?\n\nUsunięta zostanie karta pola, historia sezonów oraz ${opCount} przypisanych zabiegów. Tej operacji nie można cofnąć bez kopii danych.`))return;db.operations=db.operations.filter(o=>o.fieldId!==id);db.farmFields=db.farmFields.filter(x=>x.id!==id);if(selectedField===id)selectedField=null;save();render();toast('Pole usunięte')}
function openMergeFields(){if(db.farmFields.length<2){alert('Do połączenia potrzebne są co najmniej dwa pola.');return}const opts=db.farmFields.map(f=>`<option value="${esc(f.id)}">${esc(f.name||('Pole '+f.id))} · ${Number(f.area||0).toFixed(2)} ha</option>`).join('');const checks=db.farmFields.map(f=>`<label style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><input type="checkbox" name="sources" value="${esc(f.id)}"><span>${esc(f.name||('Pole '+f.id))} <span class="muted">(${esc(f.id)}, ${Number(f.area||0).toFixed(2)} ha)</span></span></label>`).join('');modal('Połącz pola',`<form onsubmit="mergeFields(event)"><div class="field"><label>Pole docelowe</label><select name="target" required>${opts}</select></div><div class="field full" style="margin-top:12px"><label>Pola do dołączenia</label><div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:0 10px">${checks}</div></div><div class="notice" style="margin-top:12px">Powierzchnie zostaną zsumowane, numery działek połączone bez duplikatów, a zabiegi i historia zostaną przeniesione do pola docelowego.</div>${formButtons()}</form>`)}
function mergeFields(e){e.preventDefault();const d=new FormData(e.target),targetId=d.get('target'),sourceIds=d.getAll('sources').filter(x=>x!==targetId);if(!sourceIds.length){alert('Wybierz przynajmniej jedno inne pole do połączenia.');return}const target=db.farmFields.find(f=>f.id===targetId);const sources=db.farmFields.filter(f=>sourceIds.includes(f.id));if(!target||!sources.length)return;const names=sources.map(f=>f.name||('Pole '+f.id)).join(', ');if(!confirm(`Połączyć z polem „${target.name||('Pole '+target.id)}”: ${names}?`))return;target.area=Number(target.area||0)+sources.reduce((s,f)=>s+Number(f.area||0),0);target.parcels=[...new Set([...(target.parcels||[]),...sources.flatMap(f=>f.parcels||[])])];target.history=[...(target.history||[]),...sources.flatMap(f=>f.history||[])];target.mergedFrom=[...new Set([...(target.mergedFrom||[]),...sourceIds,...sources.flatMap(f=>f.mergedFrom||[])])];for(const o of db.operations){if(sourceIds.includes(o.fieldId)){o.fieldId=targetId;o.fieldName=target.name||targetId}}db.farmFields=db.farmFields.filter(f=>!sourceIds.includes(f.id));selectedField=targetId;save();closeModal();render();toast('Pola połączone')}
function addSeason(id){const y=new Date().getFullYear()-1;modal('Dodaj sezon do pola',`<form onsubmit="saveSeason(event,'${esc(id)}')"><div class="form"><div class="field"><label>Sezon</label><input name="season" type="number" value="${y}" required></div><div class="field"><label>Uprawa</label><input name="crop" required></div><div class="field"><label>Odmiana</label><input name="variety"></div><div class="field"><label>Powierzchnia (ha)</label><input name="area" type="number" step=".01" value="${db.farmFields.find(x=>x.id===id).area}"></div><div class="field"><label>Plon (t/ha)</label><input name="yield" type="number" step=".01"></div><div class="field full"><label>Uwagi</label><textarea name="notes"></textarea></div></div>${formButtons()}</form>`)}function saveSeason(e,id){e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.season=Number(x.season);(db.farmFields.find(f=>f.id===id).history||=[]).push(x);save();closeModal();render();toast('Sezon dodany')}
function openNewField(){modal('Dodaj pole',`<form onsubmit="saveNewField(event)"><div class="form"><div class="field"><label>Oznaczenie</label><input name="id" required></div><div class="field"><label>Nazwa</label><input name="name"></div><div class="field"><label>Powierzchnia (ha)</label><input name="area" type="number" step=".01" required></div><div class="field"><label>Uprawa</label><input name="crop"></div><div class="field"><label>Odmiana</label><input name="variety"></div><div class="field full"><label>Identyfikatory działek ewidencyjnych</label><textarea name="parcels" rows="5" placeholder="Jeden pełny identyfikator w każdym wierszu"></textarea></div></div>${formButtons()}</form>`)}function saveNewField(e){e.preventDefault();const d=new FormData(e.target),id=String(d.get('id')||'').trim();if(db.farmFields.some(f=>f.id===id)){alert('Pole o takim oznaczeniu już istnieje.');return}const x={id,name:d.get('name'),area:Number(d.get('area')),crop:d.get('crop'),variety:d.get('variety'),parcels:[...new Set(String(d.get('parcels')||'').split(/[\n,;]+/).map(v=>v.trim()).filter(Boolean))],history:[],harvest:{},soilTests:[]};for(const pid of x.parcels){if(!db.parcels.some(p=>p.identifier===pid))db.parcels.push({plot:parcelShort(pid),identifier:pid,area:0,arableArea:0,crop:x.crop||'',variety:x.variety||'',yield:'',precinct:'',gmina:'',cropParts:[],source:'ręcznie'})}db.farmFields.push(x);save();closeModal();render();toast('Pole dodane')}
function openHarvest(id){const f=db.farmFields.find(x=>x.id===id),h=f?.harvest||{};modal('Zbiór — '+esc(f?.name||id),`<form onsubmit="saveHarvest(event,'${esc(id)}')"><div class="form"><div class="field"><label>Data zbioru</label><input name="date" type="date" value="${esc(h.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>Łączna masa zebranego plonu (t)</label><input name="totalT" type="number" min="0" step=".01" value="${esc(h.totalT||'')}" required></div><div class="field"><label>Wilgotność ziarna (%)</label><input name="moisture" type="number" min="0" max="100" step=".1" value="${esc(h.moisture||'')}"></div><div class="field"><label>Plon t/ha</label><input value="${h.yieldPerHa?Number(h.yieldPerHa).toFixed(2):'liczony automatycznie'}" disabled></div><div class="field full"><label>Uwagi</label><textarea name="notes">${esc(h.notes||'')}</textarea></div></div>${formButtons()}</form>`)}
function saveHarvest(e,id){e.preventDefault();const f=db.farmFields.find(x=>x.id===id),d=Object.fromEntries(new FormData(e.target));const totalT=Number(d.totalT||0),area=Number(f?.area||0);f.harvest={date:d.date,totalT,moisture:Number(d.moisture||0),yieldPerHa:area?totalT/area:0,notes:d.notes||''};save();closeModal();render();toast('Dane zbioru zapisane')}
function openSoilTest(id){const f=db.farmFields.find(x=>x.id===id);modal('Dodaj badanie gleby — '+esc(f?.name||id),`<form onsubmit="saveSoilTest(event,'${esc(id)}')"><div class="form"><div class="field"><label>Data badania / pobrania próbki</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>pH</label><input name="ph" type="number" min="0" max="14" step=".01"></div><div class="field"><label>Fosfor P₂O₅</label><input name="p" type="number" min="0" step=".01"></div><div class="field"><label>Potas K₂O</label><input name="k" type="number" min="0" step=".01"></div><div class="field"><label>Magnez Mg</label><input name="mg" type="number" min="0" step=".01"></div><div class="field full"><label>Uwagi / nr próbki / jednostka</label><textarea name="notes" placeholder="Np. próbka 12/2026, mg/100 g gleby"></textarea></div></div>${formButtons()}</form>`)}
function saveSoilTest(e,id){e.preventDefault();const f=db.farmFields.find(x=>x.id===id),x=Object.fromEntries(new FormData(e.target));(f.soilTests||=[]).push(x);save();closeModal();render();toast('Wynik badania gleby dodany')}
function operationTable(arr=db.operations){if(!arr.length)return `<div class="card empty">Brak zabiegów.</div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Rodzaj</th><th>Pole</th><th>Maszyna</th><th>Koszt / ha</th><th>Koszt razem</th><th></th></tr></thead><tbody>${arr.slice().reverse().map(x=>{const f=db.farmFields.find(q=>q.id===x.fieldId);const cph=operationCostPerHa(x,f);return `<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.fieldName||x.field||'')}</td><td>${esc(x.machine||'—')}</td><td>${money(cph)}/ha</td><td>${money(x.cost||cph*Number(f?.area||0))}</td><td><button onclick="openOperation('','', '${esc(x._id)}')">Edytuj</button></td></tr>`}).join('')}</tbody></table></div>`}
function operationsPage(c){c.innerHTML=`<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="openOperation()">＋ Dodaj zabieg</button></div>${operationTable()}`}
function openOperation(pre='',presetKind='',editId=''){const current=editId?db.operations.find(o=>o._id===editId):null;if(current){pre=current.fieldId||'';presetKind=current.kind||''}const opts=db.farmFields.map(f=>`<option value="${esc(f.id)}" data-area="${Number(f.area||0)}" ${f.id===pre?'selected':''}>${esc(f.name)} — ${esc(f.crop)}</option>`).join(''),machines=db.machines.map(x=>`<option ${current?.machine===x.name?'selected':''}>${esc(x.name)}</option>`).join('');modal(current?'Edytuj zabieg':'Dodaj zabieg',`<form onsubmit="saveOperation(event,'${esc(editId)}')"><div class="form"><div class="field"><label>Data</label><input name="date" type="date" value="${esc(current?.date||new Date().toISOString().slice(0,10))}" required></div><div class="field"><label>Rodzaj</label><select name="kind">${['Siew','Nawożenie','Oprysk','Uprawa','Zbiór','Transport','Inne'].map(k=>`<option ${k===presetKind?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>Pole</label><select name="fieldId" onchange="updateOperationCostPreview(this.form)">${opts}</select></div><div class="field"><label>Maszyna</label><select name="machine"><option ${!current?.machine||current.machine==='—'?'selected':''}>—</option>${machines}</select></div><div class="field"><label>Koszt zabiegu (zł/ha)</label><input name="costPerHa" type="number" min="0" step=".01" value="${current?operationCostPerHa(current,db.farmFields.find(q=>q.id===current.fieldId)):''}" oninput="updateOperationCostPreview(this.form)" placeholder="np. 120"></div><div class="field"><label>Środek / materiał</label><input name="material" value="${esc(current?.material||'')}"></div><div class="field"><label>Dawka / ha</label><input name="dose" value="${esc(current?.dose||'')}"></div><div class="field"><label>Woda / ha</label><input name="water" value="${esc(current?.water||'')}"></div><div class="field full"><div id="operationCostPreview" class="costpreview">Koszt całkowity zostanie obliczony z powierzchni wybranego pola.</div></div></div>${formButtons()}</form>`);setTimeout(()=>{const f=document.querySelector('#modalBody form');if(f)updateOperationCostPreview(f)},0)}
function updateOperationCostPreview(form){if(!form)return;const sel=form.elements.fieldId,f=db.farmFields.find(q=>q.id===sel?.value),area=Number(f?.area||0),cph=Number(form.elements.costPerHa?.value||0),total=area*cph,el=document.getElementById('operationCostPreview');if(el)el.innerHTML=`Pole: <b>${esc(f?.name||'—')}</b> · ${area.toFixed(2)} ha &nbsp;→&nbsp; koszt razem: <b>${money(total)}</b>`}
function saveOperation(e,editId=''){e.preventDefault();const x=Object.fromEntries(new FormData(e.target)),f=db.farmFields.find(q=>q.id===x.fieldId);x.fieldName=f?.name||x.fieldId;x.costPerHa=Number(x.costPerHa||0);x.cost=x.costPerHa*Number(f?.area||0);if(editId){const i=db.operations.findIndex(o=>o._id===editId);if(i>=0){x._id=editId;db.operations[i]=x}else{x._id=editId;db.operations.push(x)}}else{x._id='op_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);db.operations.push(x)}save();closeModal();render();toast(editId?'Zabieg zaktualizowany':'Zabieg zapisany: '+money(x.costPerHa)+'/ha, razem '+money(x.cost))}
function machinesPage(c){c.innerHTML=`<div class="actions"><button class="primary" onclick="openMachine()">＋ Dodaj maszynę</button></div><div class="section tablewrap"><table class="table"><thead><tr><th>Maszyna</th><th>Typ</th><th>Rok</th><th>Motogodziny</th></tr></thead><tbody>${db.machines.length?db.machines.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${esc(x.year)}</td><td>${esc(x.hours)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Brak maszyn.</td></tr>'}</tbody></table></div>`}function openMachine(){modal('Dodaj maszynę',`<form onsubmit="saveMachine(event)"><div class="form"><div class="field"><label>Nazwa</label><input name="name" required></div><div class="field"><label>Typ</label><input name="type"></div><div class="field"><label>Rok</label><input name="year" type="number"></div><div class="field"><label>Motogodziny</label><input name="hours" type="number" step=".1"></div></div>${formButtons()}</form>`)}function saveMachine(e){e.preventDefault();db.machines.push(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}
function financesPage(c){const co=db.finances.filter(x=>x.type==='cost').reduce((s,x)=>s+Number(x.amount||0),0),inc=db.finances.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);c.innerHTML=`<div class="grid"><div class="card"><div class="muted">Przychody</div><div class="metric">${money(inc)}</div></div><div class="card"><div class="muted">Koszty</div><div class="metric">${money(co)}</div></div><div class="card"><div class="muted">Wynik</div><div class="metric">${money(inc-co)}</div></div></div><div class="section"><button class="primary" onclick="openFinance()">＋ Dodaj pozycję</button></div>`}function openFinance(){modal('Dodaj pozycję finansową',`<form onsubmit="saveFinance(event)"><div class="form"><div class="field"><label>Data</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Typ</label><select name="type"><option value="cost">Koszt</option><option value="income">Przychód</option></select></div><div class="field"><label>Kategoria</label><input name="category"></div><div class="field"><label>Kwota</label><input name="amount" type="number" step=".01" required></div><div class="field full"><label>Opis</label><input name="note"></div></div>${formButtons()}</form>`)}function saveFinance(e){e.preventDefault();db.finances.push(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}
function backupPage(c){const logged=!!cloudState.user;c.innerHTML=`<div class="card"><h2>📱 Aplikacja na telefon</h2><p>AgroManager może działać jako aplikacja PWA z ikoną na ekranie głównym.</p><div class="actions"><button id="installAppBtn" class="primary" onclick="installAgroManager()" style="display:none">⬇ Zainstaluj AgroManager</button></div><div id="installHelp" class="install-note">Jeżeli przycisk instalacji się nie pojawi, otwórz menu przeglądarki i wybierz „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.</div></div><div class="section card"><h2>☁️ Chmura Google / Firebase</h2><p><b>${esc(cloudLabel())}</b></p>${logged?`<p class="muted">Konto: ${esc(cloudAccount())}</p><div class="actions"><button class="primary" onclick="cloudSaveNow()">☁️ Zapisz teraz</button><button onclick="cloudLogout()">Wyloguj z chmury</button></div>`:`<p>Dane są nadal bezpiecznie zapisywane lokalnie. Zaloguj się przez Google, aby utworzyć prywatną kopię w Firestore i synchronizować zmiany.</p><button class="primary" onclick="cloudLogin()">G Zaloguj przez Google</button>`}<div class="install-note" style="margin-top:12px">Po zalogowaniu każda zmiana jest zapisywana lokalnie oraz automatycznie synchronizowana z Twoją prywatną bazą Firestore.</div></div><div class="section card"><h2>👤 Użytkownik</h2><p>Aktualna nazwa: <b>${esc(userName())}</b></p><button onclick="openUserSettings()">Zmień użytkownika</button></div><div class="section card"><h2>🔐 Kopia ręczna</h2><p>Eksport JSON pozostaje dodatkową kopią bezpieczeństwa niezależną od chmury.</p><div class="actions"><button class="primary" onclick="exportData()">⬇ Eksportuj kopię</button><button onclick="document.getElementById('file').click()">⬆ Importuj kopię</button><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div>`;refreshInstallButton()}function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agromanager-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Kopia odtworzona')}catch{alert('Nieprawidłowa kopia')}};r.readAsText(f)}
function quickAdd(){modal('Co chcesz dodać?',`<div class="grid" style="grid-template-columns:1fr 1fr"><button onclick="closeModal();openNewField()">🌾<br>Pole</button><button onclick="closeModal();openOperation()">🧪<br>Zabieg</button><button onclick="closeModal();openMachine()">🚜<br>Maszyna</button><button onclick="closeModal();openFinance()">💰<br>Finanse</button></div>`)}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;refreshInstallButton()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;refreshInstallButton();toast('AgroManager został zainstalowany')});
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function refreshInstallButton(){const b=document.getElementById('installAppBtn'),h=document.getElementById('installHelp');if(!b)return;if(isStandalone()){b.style.display='none';if(h)h.textContent='AgroManager jest już uruchomiony jako zainstalowana aplikacja.'}else if(deferredInstallPrompt){b.style.display='inline-block';if(h)h.textContent='Aplikacja jest gotowa do instalacji na tym urządzeniu.'}else{b.style.display='none'}}
async function installAgroManager(){if(!deferredInstallPrompt){alert('Jeżeli przeglądarka nie pokazuje przycisku instalacji, wybierz w jej menu „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;refreshInstallButton()}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service Worker:',err)))}
ensureSettings();save();render();
</script></body></html>
